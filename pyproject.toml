[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icons-downloader"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "click==8.3.3",
    "httpx[http2]==0.28.1",
    "pytest==9.0.3",
    "tqdm==4.67.3",
]

[project.scripts]
iconify-dl = "iconify_downloader.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["iconify_downloader"]
